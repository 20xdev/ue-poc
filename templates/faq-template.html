<!DOCTYPE html>
<html>
<head>
  <title>{{properties.elements.question.value}}</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "{{properties.elements.question.value}}",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "{{properties.elements.answer.value}}"
        }
      }
    ]
  }
  </script>
</head>
<body>
  <main>
    <div>
      <h2>Frequently asked questions</h2>
      <div class="faq-item">
        <h3>{{properties.elements.question.value}}</h3>
        <p>{{properties.elements.answer.value}}</p>
      </div>
    </div>
  </main>
</body>
</html>
